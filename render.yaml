services:
  - type: web
    name: jurnal-pkl
    runtime: php
    plan: free
    region: singapore
    buildCommand: |
      composer install --no-dev --optimize-autoloader --no-interaction
      npm install --ignore-scripts
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: php artisan migrate --force && php -S 0.0.0.0:$PORT -t public
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: Jurnal PKL
      - key: APP_ENV
        value: production
      - key: APP_KEY
        value: base64:PJEafFPjOt15oW3it/dB+AzzSDtO/tz9+CKlhV+yARg=
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: APP_URL
        fromService:
          type: web
          name: jurnal-pkl
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.fhznbfvsjqaebmblkfuw
      - key: DB_PASSWORD
        value: Sigmateam12_-
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: 120
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: FILESYSTEM_DISK
        value: local
      - key: BCRYPT_ROUNDS
        value: 10
